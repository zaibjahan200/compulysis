apiVersion: apps/v1
kind: Deployment
metadata:
  name: compulysis-web
  labels:
    app: compulysis-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compulysis-web
  template:
    metadata:
      labels:
        app: compulysis-web
    spec:
      containers:
        - name: compulysis-webapp
          image: zaibjahan200/compulysis-webapp:latest
          imagePullPolicy: Always
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@compulysis-db-service:5432/compulysis_db"
            - name: SECRET_KEY
              value: "change-this-in-production-min-32-chars"
            - name: ENVIRONMENT
              value: "production"
            - name: BACKEND_CORS_ORIGINS
              value: "http://localhost:8000,http://127.0.0.1:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
